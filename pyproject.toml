[project]
name = "vclogic-vc-investor-onboarding"
version = "0.1.0"
description = "Prepare investor investment memories for the VCLogic assessment pipeline"
requires-python = ">=3.11,<3.14"
dependencies = ["vc-investment-memory>=0.2,<0.3", "vclogic-vc-agentic-assessment>=0.1,<0.2", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
embeddings = ["vclogic-vc-agentic-assessment[embeddings]>=0.1,<0.2"]

[project.scripts]
investor-onboarding = "vclogic_onboarding.cli:main"

[tool.uv.sources]
vc-investment-memory = {path = "../vclogic-vc-investment-memory", editable = true}
vclogic-vc-agentic-assessment = {path = "../vclogic-vc-agentic-assessment", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vclogic_onboarding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
